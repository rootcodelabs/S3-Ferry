apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: { { .Values.namespace } }
  labels:
    app: clamav
spec:
  type: { { .Values.service.type } }
  ports:
    - name: clamav
      port: { { .Values.service.port } }
      targetPort: clamav
      protocol: TCP
  selector:
    app: clamav
