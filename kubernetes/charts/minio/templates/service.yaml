apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: { { .Values.namespace } }
  labels:
    app: minio
spec:
  type: { { .Values.service.type } }
  ports:
    - name: api
      port: { { .Values.service.apiPort } }
      targetPort: api
      protocol: TCP
    - name: console
      port: { { .Values.service.consolePort } }
      targetPort: console
      protocol: TCP
  selector:
    app: minio
