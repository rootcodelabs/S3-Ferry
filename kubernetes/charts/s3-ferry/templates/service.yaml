apiVersion: v1
kind: Service
metadata:
  name: s3-ferry
  namespace: { { .Values.namespace } }
  labels:
    app: s3-ferry
spec:
  type: { { .Values.service.type } }
  ports:
    - name: http
      port: { { .Values.service.port } }
      targetPort: http
      protocol: TCP
  selector:
    app: s3-ferry
